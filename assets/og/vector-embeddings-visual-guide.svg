<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a2236"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative vector dots (suggesting embeddings) -->
  <g opacity="0.5">
    <circle cx="950" cy="180" r="4" fill="#22d3ee"/>
    <circle cx="990" cy="210" r="5" fill="#6366f1"/>
    <circle cx="1030" cy="160" r="3" fill="#22d3ee"/>
    <circle cx="1070" cy="230" r="6" fill="#a78bfa"/>
    <circle cx="930" cy="240" r="3" fill="#a78bfa"/>
    <circle cx="1090" cy="290" r="4" fill="#22d3ee"/>
    <line x1="950" y1="180" x2="990" y2="210" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <line x1="990" y1="210" x2="1030" y2="160" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <line x1="990" y1="210" x2="1070" y2="230" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <line x1="930" y1="240" x2="990" y2="210" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Top kicker -->
  <text x="80" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#22d3ee" letter-spacing="4">VISUAL GUIDE</text>

  <!-- Title -->
  <text x="80" y="220" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="82" font-weight="800" fill="#e8eaf6">Vector Embeddings</text>
  <text x="80" y="310" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="82" font-weight="800" fill="#e8eaf6">Explained</text>

  <!-- Subtitle -->
  <text x="80" y="395" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="30" fill="#9aa3b2">From raw text to numbers —</text>
  <text x="80" y="435" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="30" fill="#9aa3b2">the engine behind RAG &amp; semantic search</text>

  <!-- Bottom -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#2d3856" stroke-width="2"/>
  <text x="80" y="580" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="22" font-weight="700" fill="#e8eaf6">Akash Gupta</text>
  <text x="1120" y="580" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#9aa3b2">akashverse-thinking-out-loud</text>
</svg>

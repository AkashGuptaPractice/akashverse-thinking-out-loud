<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ee"/>
      <stop offset="100%" stop-color="#fdfaf5"/>
    </linearGradient>
    <pattern id="rules" width="60" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="60" y2="31.5" stroke="#e8e0d0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#rules)" opacity="0.6"/>

  <!-- Top kicker -->
  <text x="80" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#c0392b" letter-spacing="4">DEEP TECHNICAL DIVE · CHAPTER BY CHAPTER</text>

  <!-- Title -->
  <text x="80" y="220" font-family="Georgia, serif"
        font-size="78" font-weight="900" fill="#1a1209">Building</text>
  <text x="80" y="320" font-family="Georgia, serif" font-style="italic"
        font-size="92" font-weight="900" fill="#c0392b">Vector Embeddings</text>
  <text x="80" y="408" font-family="Georgia, serif"
        font-size="78" font-weight="900" fill="#1a1209">From Scratch</text>

  <!-- Subtitle -->
  <text x="80" y="465" font-family="Georgia, serif" font-style="italic"
        font-size="26" fill="#7a6e60">Every equation shown — using "machine learning" as the worked example</text>

  <!-- Bottom strip -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1a1209" stroke-width="2"/>
  <text x="80" y="580" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="22" font-weight="700" fill="#1a1209">Akash Gupta</text>
  <text x="1120" y="580" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#7a6e60">akashverse-thinking-out-loud</text>
</svg>

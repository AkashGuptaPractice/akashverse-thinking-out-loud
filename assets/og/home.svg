<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#1c2030"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#b78aff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b78aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.6" cy="0.2" r="0.35">
      <stop offset="0%" stop-color="#5fe3a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5fe3a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#b78aff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Top kicker -->
  <text x="80" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" fill="#7aa2ff" letter-spacing="4">AKASHVERSE · THINKING OUT LOUD</text>

  <!-- Avatar -->
  <circle cx="160" cy="320" r="60" fill="url(#avatarBg)"/>
  <text x="160" y="340" text-anchor="middle" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="46" font-weight="700" fill="white" letter-spacing="2">AG</text>

  <!-- Name + tagline -->
  <text x="260" y="305" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="52" font-weight="700" fill="#e7e9ee">Akash Gupta</text>
  <text x="260" y="350" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="26" fill="#9aa3b2">Software Engineer @ Pegasystems · M.Tech CSE, IIT Bombay</text>
  <text x="260" y="386" font-family="-apple-system, Segoe UI, Inter, sans-serif"
        font-size="22" fill="#9aa3b2">Backend / Platform Security · Learning in public</text>

  <!-- Bottom URL -->
  <text x="80" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" fill="#5a6371">akashguptapractice.github.io/akashverse-thinking-out-loud</text>

  <!-- Decorative right-side dot -->
  <circle cx="1080" cy="540" r="6" fill="#5fe3a1"/>
  <text x="1100" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#9aa3b2">OPEN TO CHAT</text>
</svg>
